# ============================================
#  MaiBot 模型配置示例
#  复制此文件为 model_config.toml 后修改
# ============================================

[[api_providers]]
name = "DeepSeek"
api_key = "sk-你的DeepSeekKey"         # ← 改成你的 DeepSeek API Key
base_url = "https://api.deepseek.com"
client_type = "openai"
timeout = 60

[[models]]
model_identifier = "deepseek-v4-pro"
name = "deepseek-v4-pro-think"
api_provider = "DeepSeek"
price_in = 12.0
price_out = 24.0
extra_params = {thinking = {type = "enabled"}, reasoning_effort = "high"}

[[models]]
model_identifier = "deepseek-v4-pro"
name = "deepseek-v4-pro-nonthink"
api_provider = "DeepSeek"
price_in = 12.0
price_out = 24.0
extra_params = {thinking = {type = "disabled"}}

[[models]]
model_identifier = "deepseek-v4-flash"
name = "deepseek-v4-flash"
api_provider = "DeepSeek"
price_in = 1.0
price_out = 2.0

[model_task_config.planner]
model_list = ["deepseek-v4-flash"]
max_tokens = 8000
temperature = 0.7

[model_task_config.replyer]
model_list = ["deepseek-v4-pro-think", "deepseek-v4-pro-nonthink"]
max_tokens = 4096
temperature = 1.0
selection_strategy = "random"

[model_task_config.utils]
model_list = ["deepseek-v4-flash"]
max_tokens = 4096
temperature = 0.5

